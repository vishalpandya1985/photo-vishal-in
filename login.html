<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>photo.vishal.in - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #FF3CAC 0%, #FF6B6B 50%, #FFAA4C 100%);
    background-size: 200% 200%;
    animation: gradientShift 12s ease infinite;
    padding: 20px;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .blob {
    position: fixed; border-radius: 50%; filter: blur(1px);
    opacity: 0.4; pointer-events: none; z-index: 0;
    animation: floatBlob 7s ease-in-out infinite;
  }
  .blob1 { width: 60px; height: 60px; background: #FFD93D; top: 10%; left: 12%; animation-delay: 0s; }
  .blob2 { width: 44px; height: 44px; background: #00D9C0; top: 72%; left: 16%; animation-delay: 1.4s; }
  .blob3 { width: 80px; height: 80px; background: #FF6B6B; top: 14%; right: 10%; animation-delay: 0.6s; }
  .blob4 { width: 36px; height: 36px; background: #ffffff; top: 62%; right: 14%; animation-delay: 2.1s; }
  @keyframes floatBlob {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-18px) scale(1.08); }
  }

  .card, .hero, .credit { position: relative; z-index: 1; }

  .card {
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(10px);
    padding: 40px 36px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    width: 100%;
    max-width: 340px;
    text-align: center;
    animation: floatIn 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes floatIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .icon { width: 64px; height: 64px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, #00D9C0, #00A88F);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(0, 168, 143, 0.4);
  }
  .icon svg { width: 30px; height: 30px; }

  .hero {
    width: 100%; max-width: 340px;
    margin: 0 auto 22px;
  }
  .hero svg { width: 100%; height: auto; display: block; }

  h1 { font-family: 'Baloo 2', cursive; font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-bottom: 4px; }
  .subtitle { font-size: 0.85rem; color: #9ca3af; margin-bottom: 24px; }

  .field { position: relative; margin-bottom: 16px; text-align: left; }
  .field input {
    width: 100%;
    padding: 13px 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .field input:focus {
    border-color: #00A88F;
    box-shadow: 0 0 0 3px rgba(0, 168, 143, 0.12);
  }

  button {
    width: 100%;
    padding: 13px;
    border: none;
    background: linear-gradient(135deg, #00D9C0, #00A88F);
    color: white;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
    box-shadow: 0 6px 16px rgba(0, 168, 143, 0.35);
  }
  button:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 20px rgba(0, 168, 143, 0.45); }
  button:active { transform: scale(0.96); }

  .error {
    color: #dc2626;
    background: #fef2f2;
    border: 1px solid #fecaca;
    padding: 8px;
    border-radius: 8px;
    font-size: 0.82rem;
    margin-bottom: 14px;
    display: none;
  }
  .error.show { display: block; }

  .credit {
    margin-top: 22px;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.3px;
  }
  .credit strong { color: #fff; font-weight: 600; }

  @media (max-width: 420px) {
    .hero { max-width: 220px; margin-bottom: 14px; }
    .card { padding: 30px 24px; }
    h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
  <div class="hero">
    <svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cardGrad1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
        </linearGradient>
        <linearGradient id="arrowGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#CCFBF1"/>
          <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
      </defs>
      <g transform="rotate(-10 70 78)">
        <rect x="30" y="48" width="80" height="60" rx="10" fill="url(#cardGrad1)"/>
        <circle cx="70" cy="78" r="13" fill="none" stroke="#00A88F" stroke-width="3" opacity="0.5"/>
        <path d="M65 71 L80 78 L65 85 Z" fill="#00A88F" opacity="0.6"/>
      </g>
      <g transform="rotate(8 140 82)">
        <rect x="100" y="50" width="82" height="62" rx="10" fill="url(#cardGrad1)"/>
        <circle cx="122" cy="70" r="7" fill="#fbbf24" opacity="0.85"/>
        <path d="M108 104 L128 82 L142 94 L158 74 L176 104 Z" fill="#FF6B6B" opacity="0.45"/>
      </g>
      <g transform="translate(96 8)">
        <circle cx="14" cy="14" r="16" fill="url(#arrowGrad)"/>
        <path d="M14 20 V8 M9 13 L14 8 L19 13" stroke="#00A88F" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
  </div>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"/>
        <path d="M8 11 V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to continue</p>
    <div class="error" id="error">Incorrect username or password.</div>
    <form method="POST" action="/login">
      <div class="field">
        <input type="text" name="username" placeholder="Username" required autofocus>
      </div>
      <div class="field">
        <input type="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit">Log In</button>
    </form>
    <p style="margin-top:14px; font-size:0.78rem; color:#9ca3af;">Forgot password? Contact your administrator to have it reset.</p>
  </div>
  <div class="credit">Developed by <strong>VISHAL PANDYA</strong></div>
  <script>
    if (new URLSearchParams(window.location.search).get('error')) {
      document.getElementById('error').classList.add('show');
    }
  </script>
</body>
</html>
