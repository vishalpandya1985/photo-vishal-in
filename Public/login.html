<html lang="en">

<title>photo.vishal.in - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column;
    color: #23262B;
  }

  .hero {
    position: relative;
    flex: 1;
    min-height: 640px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    overflow: hidden;
    padding: 30px 20px;
  }
  .hero .bg-scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .hero .bg-scene svg { width: 100%; height: 100%; display: block; }
  .hero > * { position: relative; z-index: 1; }

  .logo-box {
    border: 1.5px solid rgba(255,255,255,0.85);
    padding: 22px 42px;
    margin-bottom: 34px;
  }
  .logo-box span {
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 300;
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    letter-spacing: 0.12em;
    color: #fff;
    text-transform: lowercase;
  }

  form {
    width: 100%; max-width: 300px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .field { text-align: left; }
  .field label {
    display: block; font-family: 'Josefin Sans', sans-serif; font-weight: 400;
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: rgba(255,255,255,0.75); margin-bottom: 7px;
  }
  .field input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid rgba(255,255,255,0.5);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 8px 2px;
    outline: none;
    transition: border-color 0.25s;
    letter-spacing: 0.02em;
  }
  .field input::placeholder { color: rgba(255,255,255,0.5); }
  .field input:focus { border-bottom-color: #fff; }

  button {
    margin-top: 12px;
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.85);
    color: #fff;
    padding: 13px;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.25s, color 0.25s, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  button:hover { background: rgba(255,255,255,0.95); color: #0E4A52; transform: translateY(-2px); }
  button:active { transform: translateY(0); }

  .error {
    color: #fff;
    background: rgba(180, 50, 40, 0.55);
    border: 1px solid rgba(255,150,130,0.5);
    padding: 8px 14px;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
    display: none;
  }
  .error.show { display: block; }

  .forgot {
    margin-top: 18px;
    font-size: 0.76rem;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.02em;
  }

  .info-band {
    background: #F7F4EF;
    padding: 26px 20px;
    text-align: center;
  }
  .info-band p {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    color: #6b6459;
    line-height: 1.7;
    max-width: 480px;
    margin: 0 auto;
  }

  .footer-band {
    background: #EDE9E2;
    padding: 16px 20px;
    text-align: center;
  }
  .footer-band p {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: #8a8378;
    text-transform: uppercase;
  }
  .footer-band strong { color: #5c5648; font-weight: 600; }

  @media (max-width: 480px) {
    .hero { min-height: 560px; padding: 20px 16px; }
    .logo-box { padding: 16px 28px; margin-bottom: 26px; }
    .info-band p { font-size: 0.8rem; }
  }
</style>

    </div>

    <div class="logo-box"><span>photo.vishal.in</span></div>

    <form method="POST" action="/login">
      <div class="error" id="error">Incorrect username or password.</div>
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit">Log In</button>
