<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>photo.vishal.in - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    color: #23262B;
  }

  .bg-scene {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1;
  }
  .bg-scene svg { width: 100%; height: 100%; display: block; }

  .topnav {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 10px;
    padding: 28px 40px;
  }
  .topnav .mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
  }
  .topnav .mark svg { width: 16px; height: 16px; }
  .topnav .wordmark {
    font-family: 'Playfair Display', serif; font-weight: 600; font-size: 1.05rem;
    color: rgba(255,255,255,0.95); letter-spacing: 0.2px;
  }

  .stage {
    position: relative; z-index: 2;
    min-height: calc(100vh - 90px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px 20px 60px;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(20, 24, 30, 0.45); border: 1px solid rgba(255,255,255,0.22);
    color: rgba(255,255,255,0.92); font-size: 0.78rem; font-weight: 500;
    padding: 7px 16px; border-radius: 999px; margin-bottom: 26px;
    backdrop-filter: blur(6px);
  }
  .badge svg { width: 13px; height: 13px; }

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600; font-style: italic;
    color: #fff;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    line-height: 1.12;
    text-shadow: 0 2px 24px rgba(0,0,0,0.35);
    margin-bottom: 14px;
  }
  .subtitle {
    color: rgba(255,255,255,0.82);
    font-size: 1rem;
    max-width: 420px;
    margin: 0 auto 40px;
    text-shadow: 0 1px 12px rgba(0,0,0,0.3);
  }

  form {
    width: 100%; max-width: 320px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .field { text-align: left; }
  .field label {
    display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: rgba(255,255,255,0.65); margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid rgba(255,255,255,0.4);
    color: #fff;
    font-family: inherit;
    font-size: 1rem;
    padding: 8px 2px;
    outline: none;
    transition: border-color 0.25s;
  }
  .field input::placeholder { color: rgba(255,255,255,0.45); }
  .field input:focus { border-bottom-color: #E8B04C; }

  button {
    margin-top: 10px;
    background: #fff;
    color: #1F2A38;
    border: none;
    border-radius: 999px;
    padding: 13px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  button:hover { transform: translateY(-2px) scale(1.01); box-shadow: 0 10px 28px rgba(0,0,0,0.3); }
  button:active { transform: scale(0.98); }

  .error {
    color: #ffd9d0;
    background: rgba(180, 50, 40, 0.35);
    border: 1px solid rgba(255,150,130,0.4);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.82rem;
    margin-bottom: 4px;
    display: none;
  }
  .error.show { display: block; }

  .forgot {
    margin-top: 16px;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.6);
  }

  .credit {
    position: relative; z-index: 2;
    text-align: center; padding-bottom: 26px;
    font-size: 0.76rem; color: rgba(255,255,255,0.55);
    letter-spacing: 0.2px;
  }
  .credit strong { color: rgba(255,255,255,0.85); font-weight: 600; }

  @media (max-width: 480px) {
    .topnav { padding: 20px 22px; }
    .stage { padding: 10px 18px 40px; }
    h1 { font-size: 2.1rem; }
    .subtitle { font-size: 0.9rem; margin-bottom: 30px; }
  }
</style>
</head>

      <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

        </g>
        <g transform="translate(140,650) scale(0.55)">
          <rect x="34" y="230" width="10" height="90" />

          <path d="M39 110 L-6 210 L84 210 Z"/>
          <path d="M39 165 L-14 265 L92 265 Z"/>
        </g>
      </g>

      <g fill="#141A20">
        <g transform="translate(1500,560)">
          <rect x="34" y="230" width="10" height="90" />
          <path d="M39 60 L0 160 L78 160 Z"/>
          <path d="M39 110 L-6 210 L84 210 Z"/>
          <path d="M39 165 L-14 265 L92 265 Z"/>
        </g>
        <g transform="translate(1430,610) scale(0.8)">
          <rect x="34" y="230" width="10" height="90" />
          <path d="M39 60 L0 160 L78 160 Z"/>
          <path d="M39 110 L-6 210 L84 210 Z"/>
          <path d="M39 165 L-14 265 L92 265 Z"/>
        </g>
        <g transform="translate(1370,655) scale(0.55)">
          <rect x="34" y="230" width="10" height="90" />
          <path d="M39 60 L0 160 L78 160 Z"/>
          <path d="M39 110 L-6 210 L84 210 Z"/>
          <path d="M39 165 L-14 265 L92 265 Z"/>
        </g>
      </g>

      <rect x="0" y="0" width="1600" height="900" fill="url(#vignette)"/>
    </svg>
  </div>

  <div class="topnav">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </div>
    <span class="wordmark">photo.vishal.in</span>
  </div>

  <div class="stage">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11 V7a4 4 0 0 1 8 0v4"/></svg>
      Private photo &amp; video vault
    </div>
    <h1>Welcome back.</h1>
    <p class="subtitle">Sign in to reach your photos and videos, kept safe in one place.</p>

    <form method="POST" action="/login">
      <div class="error" id="error">Incorrect username or password.</div>
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit">Log In</button>
    </form>
    <p class="forgot">Forgot password? Contact your administrator to have it reset.</p>
  </div>

  <div class="credit">Developed by <strong>VISHAL PANDYA</strong></div>

  <script>
    if (new URLSearchParams(window.location.search).get('error')) {
      document.getElementById('error').classList.add('show');
