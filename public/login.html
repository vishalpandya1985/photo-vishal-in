<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>photo.vishal.in - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #6b46c1 100%);
    background-size: 200% 200%;
    animation: gradientShift 12s ease infinite;
    padding: 20px;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(10px);
    padding: 40px 36px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    width: 100%;
    max-width: 340px;
    text-align: center;
    animation: floatIn 0.5s ease;
  }
  @keyframes floatIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .icon {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 8px 20px rgba(118, 75, 162, 0.4);
  }

  h1 { font-size: 1.4rem; font-weight: 600; color: #1f2937; margin-bottom: 4px; }
  .subtitle { font-size: 0.85rem; color: #9ca3af; margin-bottom: 24px; }

  .field { position: relative; margin-bottom: 16px; text-align: left; }
  .field input {
    width: 100%;
    padding: 13px 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .field input:focus {
    border-color: #764ba2;
    box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.12);
  }

  button {
    width: 100%;
    padding: 13px;
    border: none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 6px 16px rgba(118, 75, 162, 0.35);
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(118, 75, 162, 0.45); }
  button:active { transform: translateY(0); }

  .error {
    color: #dc2626;
    background: #fef2f2;
    border: 1px solid #fecaca;
    padding: 8px;
    border-radius: 8px;
    font-size: 0.82rem;
    margin-bottom: 14px;
    display: none;
  }
  .error.show { display: block; }

  .credit {
    margin-top: 22px;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.3px;
  }
  .credit strong { color: #fff; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔐</div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to continue</p>
    <div class="error" id="error">Incorrect username or password.</div>
    <form method="POST" action="/login">
      <div class="field">
        <input type="text" name="username" placeholder="Username" required autofocus>
      </div>
      <div class="field">
        <input type="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit">Log In</button>
    </form>
    <p style="margin-top:14px; font-size:0.78rem; color:#9ca3af;">Forgot password? Contact your administrator to have it reset.</p>
  </div>
  <div class="credit">Developed by <strong>VISHAL PANDYA</strong></div>
  <script>
    if (new URLSearchParams(window.location.search).get('error')) {
      document.getElementById('error').classList.add('show');
    }
  </script>
</body>
</html>
