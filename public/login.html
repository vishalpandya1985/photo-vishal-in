<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>photo.vishal.in - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    color: #0A0A0A;
    background: #050505;
  }

  .bg-scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }
  .bg-scene svg { width: 100%; height: 100%; display: block; }

  .topnav {
    position: relative; z-index: 2;
    padding: 28px 40px;
  }
  .topnav .wordmark {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.85rem;
    color: rgba(255,255,255,0.92); letter-spacing: 0.16em; text-transform: uppercase;
  }

  .stage {
    position: relative; z-index: 2;
    min-height: calc(100vh - 90px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px 20px 60px;
  }

  .rule { width: 46px; height: 2px; background: rgba(255,255,255,0.6); margin: 0 auto 22px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    color: #fff;
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    letter-spacing: 0.02em;
    line-height: 1.08;
    text-shadow: 0 2px 24px rgba(0,0,0,0.6);
    margin-bottom: 16px;
  }
  .subtitle {
    color: rgba(255,255,255,0.72);
    font-size: 0.95rem;
    max-width: 400px;
    margin: 0 auto 40px;
  }

  form { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 18px; }
  .field { text-align: left; }
  .field label {
    display: block; font-family: 'Space Grotesk', sans-serif; font-weight: 500;
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: rgba(255,255,255,0.6); margin-bottom: 7px;
  }
  .field input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid rgba(255,255,255,0.4);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 8px 2px;
    outline: none;
    transition: border-color 0.25s;
  }
  .field input::placeholder { color: rgba(255,255,255,0.4); }
  .field input:focus { border-bottom-color: #fff; }

  button {
    margin-top: 12px;
    background: #fff;
    color: #0A0A0A;
    border: 1.5px solid #fff;
    padding: 13px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  button:hover { background: transparent; color: #fff; transform: translateY(-2px); }
  button:active { transform: translateY(0); }

  .error {
    color: #fff;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.4);
    padding: 8px 14px;
    font-size: 0.78rem;
    margin-bottom: 2px;
    display: none;
  }
  .error.show { display: block; }

  .forgot { margin-top: 18px; font-size: 0.76rem; color: rgba(255,255,255,0.55); }

  .credit {
    position: relative; z-index: 2;
    text-align: center; padding-bottom: 26px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }
  .credit strong { color: rgba(255,255,255,0.8); font-weight: 600; }

  @media (max-width: 480px) {
    .topnav { padding: 20px 22px; }
    .stage { padding: 10px 18px 40px; }
    h1 { font-size: 2rem; }
    .subtitle { font-size: 0.88rem; margin-bottom: 30px; }
  }
</style>
</head>
<body>

  <div class="bg-scene">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bandGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#F0F0F0"/>
          <stop offset="45%" stop-color="#8A8A8A"/>
          <stop offset="100%" stop-color="#1A1A1A"/>
        </linearGradient>
        <pattern id="facets" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(26)">
          <polygon points="0,18 18,0 18,18" fill="#ffffff" fill-opacity="0.5"/>
          <polygon points="18,0 36,18 18,18" fill="#050505" fill-opacity="0.55"/>
          <polygon points="0,18 18,36 18,18" fill="#050505" fill-opacity="0.4"/>
          <polygon points="18,36 36,18 18,18" fill="#ffffff" fill-opacity="0.3"/>
          <polygon points="0,18 18,0 36,18 18,36" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="1"/>
        </pattern>
        <clipPath id="bandClip">
          <path d="M -100,650 C 300,500 500,150 900,60 C 1200,-10 1500,80 1750,200 L 1750,950 L -100,950 Z"/>
        </clipPath>
        <radialGradient id="glow2" cx="65%" cy="15%" r="55%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect x="0" y="0" width="1600" height="900" fill="#050505"/>
      <rect x="0" y="0" width="1600" height="900" fill="url(#glow2)"/>
      <g clip-path="url(#bandClip)">
        <rect x="-100" y="-100" width="1900" height="1200" fill="url(#bandGrad)"/>
        <rect x="-100" y="-100" width="1900" height="1200" fill="url(#facets)"/>
      </g>
      <rect x="0" y="0" width="1600" height="900" fill="#000000" opacity="0.15"/>
    </svg>
  </div>

  <div class="topnav">
    <span class="wordmark">photo.vishal.in</span>
  </div>

  <div class="stage">
    <div class="rule"></div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to reach your photos and videos, kept safe in one place.</p>

    <form method="POST" action="/login">
      <div class="error" id="error">Incorrect username or password.</div>
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit">Log In</button>
    </form>
    <p class="forgot">Forgot password? Contact your administrator.</p>
  </div>

  <div class="credit">Developed by <strong>Vishal Pandya</strong></div>

  <script>
    if (new URLSearchParams(window.location.search).get('error')) {
      document.getElementById('error').classList.add('show');
    }
  </script>
</body>
</html>
