<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>photo.vishal.in - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    color: #0A0A0A;
    background: #050505;
  }

  .bg-scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }
  .bg-scene svg { width: 100%; height: 100%; display: block; }

  .topnav {
    position: relative; z-index: 2;
    padding: 28px 40px;
  }
  .topnav .wordmark {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.85rem;
    color: rgba(255,255,255,0.92); letter-spacing: 0.16em; text-transform: uppercase;
    text-shadow: 0 1px 10px rgba(0,0,0,0.7);
  }

  .stage {
    position: relative; z-index: 2;
    min-height: calc(100vh - 90px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px 20px 60px;
  }
  .stage::before {
    content: "";
    position: absolute;
    top: -10%; left: 50%; transform: translateX(-50%);
    width: min(700px, 130%); height: 120%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0) 80%);
    z-index: -1;
  }

  .rule { width: 46px; height: 2px; background: rgba(255,255,255,0.6); margin: 0 auto 22px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    color: #fff;
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    letter-spacing: 0.02em;
    line-height: 1.08;
    text-shadow: 0 2px 24px rgba(0,0,0,0.6);
    margin-bottom: 16px;
  }
  .subtitle {
    color: rgba(255,255,255,0.78);
    font-size: 0.95rem;
    max-width: 400px;
    margin: 0 auto 40px;
    text-shadow: 0 1px 10px rgba(0,0,0,0.65);
  }

  form { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 18px; }
  .field { text-align: left; }
  .field label {
    display: block; font-family: 'Space Grotesk', sans-serif; font-weight: 500;
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: rgba(255,255,255,0.7); margin-bottom: 7px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  .field input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid rgba(255,255,255,0.4);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 8px 2px;
    outline: none;
    transition: border-color 0.25s;
  }
  .field input::placeholder { color: rgba(255,255,255,0.4); }
  .field input:focus { border-bottom-color: #fff; }

  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 30px; }
  .pw-toggle {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    background: none; border: none; padding: 4px; margin: 0;
    color: rgba(255,255,255,0.55); cursor: pointer; display: flex;
    box-shadow: none; width: auto;
  }
  .pw-toggle:hover { color: #fff; background: none; transform: translateY(-50%); }
  .pw-toggle:active { transform: translateY(-50%); }

  button {
    margin-top: 12px;
    background: #fff;
    color: #0A0A0A;
    border: 1.5px solid #fff;
    padding: 13px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  button:hover { background: transparent; color: #fff; transform: translateY(-2px); }
  button:active { transform: translateY(0); }

  .error {
    color: #fff;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.4);
    padding: 8px 14px;
    font-size: 0.78rem;
    margin-bottom: 2px;
    display: none;
  }
  .error.show { display: block; }

  .forgot { margin-top: 18px; font-size: 0.76rem; color: rgba(255,255,255,0.65); text-shadow: 0 1px 8px rgba(0,0,0,0.6); }

  .credit {
    position: relative; z-index: 2;
    text-align: center; padding-bottom: 26px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    text-shadow: 0 1px 8px rgba(0,0,0,0.7);
  }
  .credit strong { color: rgba(255,255,255,0.9); font-weight: 600; }

  @media (max-width: 480px) {
    .topnav { padding: 20px 22px; }
    .stage { padding: 10px 18px 40px; }
    h1 { font-size: 2rem; }
    .subtitle { font-size: 0.88rem; margin-bottom: 30px; }
  }
</style>
</head>
<body>

  <div class="bg-scene">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bandGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#A8A8A8"/>
          <stop offset="45%" stop-color="#5C5C5C"/>
          <stop offset="100%" stop-color="#1A1A1A"/>
        </linearGradient>
        <pattern id="facets" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(26)">
          <polygon points="0,18 18,0 18,18" fill="#ffffff" fill-opacity="0.32"/>
          <polygon points="18,0 36,18 18,18" fill="#050505" fill-opacity="0.55"/>
          <polygon points="0,18 18,36 18,18" fill="#050505" fill-opacity="0.4"/>
          <polygon points="18,36 36,18 18,18" fill="#ffffff" fill-opacity="0.18"/>
          <polygon points="0,18 18,0 36,18 18,36" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="1"/>
        </pattern>
        <clipPath id="bandClip">
          <path d="M -100,650 C 300,500 500,150 900,60 C 1200,-10 1500,80 1750,200 L 1750,950 L -100,950 Z"/>
        </clipPath>
        <radialGradient id="glow2" cx="65%" cy="15%" r="55%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect x="0" y="0" width="1600" height="900" fill="#050505"/>
      <rect x="0" y="0" width="1600" height="900" fill="url(#glow2)"/>
      <g clip-path="url(#bandClip)">
        <rect x="-100" y="-100" width="1900" height="1200" fill="url(#bandGrad)"/>
        <rect x="-100" y="-100" width="1900" height="1200" fill="url(#facets)"/>
      </g>
      <rect x="0" y="0" width="1600" height="900" fill="#000000" opacity="0.55"/>
    </svg>
  </div>

  <div class="topnav">
    <span class="wordmark">photo.vishal.in</span>
  </div>

  <div class="stage">
    <div class="rule"></div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to reach your photos and videos, kept safe in one place.</p>

    <form method="POST" action="/login">
      <div class="error" id="error">Incorrect username or password.</div>
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="loginPassword" name="password" placeholder="Enter password" required>
          <button type="button" class="pw-toggle" onclick="togglePw('loginPassword', this)" aria-label="Show password">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit">Log In</button>
    </form>
    <p class="forgot">Forgot password? Contact your administrator.</p>
  </div>

  <div class="credit">Developed by <strong>Vishal Pandya</strong></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    function playTones(notes) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        let t = ctx.currentTime;
        notes.forEach(([freq, dur]) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          osc.connect(gain).connect(ctx.destination);
          osc.start(t);
          osc.stop(t + dur + 0.03);
          t += dur * 0.85;
        });
      } catch (e) { /* audio blocked or unsupported — fail silently */ }
    }
    function playErrorSound() { playTones([[220.00, 0.12], [174.61, 0.12], [220.00, 0.2]]); }

    if (new URLSearchParams(window.location.search).get('error')) {
      document.getElementById('error').classList.add('show');
      playErrorSound();
    }

    function togglePw(inputId, btn) {
      const input = document.getElementById(inputId);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      btn.innerHTML = showing
        ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>'
        : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-2.68 3.87M14.12 14.12A3 3 0 1 1 9.88 9.88"/><path d="M1 1l22 22"/></svg>';
    }
  </script>
</body>
</html>
